<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT Exploded Car AR</title><style>body{margin:0;background:#172331;color:white;font:15px Arial}#controls{position:fixed;top:10px;left:10px;z-index:3;background:#142434e8;padding:12px;border-radius:10px;max-width:260px}button{padding:9px;margin:3px;background:#245576;color:white;border:0;border-radius:6px}input{width:210px}#status{position:fixed;bottom:15px;left:10px;z-index:4;background:#142434dd;padding:8px;border-radius:6px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><div id="controls"><b>TRADESIGHT · EXPLODED CAR</b><p>Exploded construction · AR</p><label>Explode <input id="explode" type="range" min="0" max="200" value="100"></label><button id="assemble">Assemble</button><button id="separate">Explode</button><div id="ar"></div><small>In AR, move phone to find a surface and tap to place.</small></div><div id="status">Loading 3D construction…</div><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{ARButton}from'three/addons/webxr/ARButton.js';
const status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color(0x172331);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.01,100);camera.position.set(5,4,7);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x344455,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(5,8,6);scene.add(sun);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;const car=new THREE.Group();scene.add(car);const parts=[];const mat=(c,metal=.2)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:.42,side:THREE.DoubleSide});const silver=mat(0xb5c6d4,.7),dark=mat(0x27323a),glass=mat(0x7cb8d0,.3),rubber=mat(0x111317),red=mat(0xb63c36);function part(name,geo,m,x,y,z,dx=0,dy=0,dz=0){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.userData={name,base:new THREE.Vector3(x,y,z),offset:new THREE.Vector3(dx,dy,dz)};car.add(o);parts.push(o);return o}function box(n,w,h,d,m,x,y,z,dx=0,dy=0,dz=0){return part(n,new THREE.BoxGeometry(w,h,d),m,x,y,z,dx,dy,dz)}function wheel(n,x,z,s){const g=new THREE.CylinderGeometry(.39,.39,.22,32);g.rotateZ(Math.PI/2);part(n,g,rubber,x,.42,z,s,0,z>0?1:-1);const hub=new THREE.CylinderGeometry(.21,.21,.24,20);hub.rotateZ(Math.PI/2);part(n+' hub',hub,silver,x,.42,z,s*1.2,0,z>0?1.1:-1.1)}
box('Chassis',3.2,.18,1.45,dark,0,.45,0,0,-.6,0);box('Floor',2.8,.08,1.3,silver,0,.65,0,0,-.35,0);box('Roof',1.65,.12,1.3,silver,-.25,1.75,0,0,1.2,0);box('Bonnet',1.1,.12,1.5,silver,1.13,1.05,0,1.2,.3,0);box('Boot lid',.6,.12,1.45,silver,-1.35,1.05,0,-1,.4,0);for(const s of [-1,1]){box('Door',1.15,.7,.07,silver,-.3,1.06,s*.77,0,.2,s*1.1);box('Front wing',.85,.47,.07,silver,1.13,.88,s*.76,1,.3,s*.65);box('Rear wing',.65,.48,.07,silver,-1.35,.88,s*.76,-1,.3,s*.65);box('Side window',.85,.48,.035,glass,-.3,1.47,s*.72,0,.7,s*.9);wheel('Front wheel',1.08,s*.79,s*1.2);wheel('Rear wheel',-1.14,s*.79,s*1.2);box('Seat',.5,.65,.5,red,-.45,.95,s*.37,0,.6,s*.3)}box('Windscreen',.07,.63,1.3,glass,.55,1.45,0,.3,.8,0);box('Rear window',.06,.5,1.25,glass,-1.14,1.48,0,-.4,.8,0);box('Engine',.7,.6,.65,red,1.12,.85,0,0,1.2,0);box('Gearbox',.55,.4,.45,dark,.45,.7,0,0,-.7,0);box('Dashboard',.3,.2,1.25,dark,.5,1.12,0,0,.5,0);box('Front bumper',.18,.25,1.55,silver,1.69,.57,0,1.4,0,0);box('Rear bumper',.18,.25,1.55,silver,-1.69,.57,0,-1.4,0,0);
function update(){const e=Number(document.getElementById('explode').value)/100;for(const p of parts)p.position.copy(p.userData.base).addScaledVector(p.userData.offset,e)}document.getElementById('explode').oninput=update;document.getElementById('assemble').onclick=()=>{document.getElementById('explode').value=0;update()};document.getElementById('separate').onclick=()=>{document.getElementById('explode').value=100;update()};update();
const reticle=new THREE.Mesh(new THREE.RingGeometry(.07,.09,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x00ff99,side:THREE.DoubleSide}));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);let hitSource=null,refSpace=null;const ar=ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});document.getElementById('ar').appendChild(ar);renderer.xr.addEventListener('sessionstart',async()=>{scene.background=null;car.scale.setScalar(.2);car.position.set(0,0,-1);status.textContent='AR camera active: scan floor, then tap to place';try{const session=renderer.xr.getSession();const viewer=await session.requestReferenceSpace('viewer');refSpace=renderer.xr.getReferenceSpace();hitSource=await session.requestHitTestSource({space:viewer})}catch(e){status.textContent='AR surface tracking error: '+e.message}});renderer.xr.addEventListener('sessionend',()=>{hitSource?.cancel();hitSource=null;reticle.visible=false;scene.background=new THREE.Color(0x172331);car.position.set(0,0,0);car.scale.setScalar(1);status.textContent='3D model ready'});renderer.domElement.addEventListener('click',()=>{if(renderer.xr.isPresenting&&reticle.visible){car.position.setFromMatrixPosition(reticle.matrix);status.textContent='Car placed in AR'}});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop((t,frame)=>{if(!renderer.xr.isPresenting)orbit.update();if(frame&&hitSource&&refSpace){const hits=frame.getHitTestResults(hitSource);reticle.visible=hits.length>0;if(hits.length){const pose=hits[0].getPose(refSpace);if(pose)reticle.matrix.fromArray(pose.transform.matrix)}}renderer.render(scene,camera)});status.textContent='3D model ready · AR requires Chrome Android and compatible device';
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT Lighthouse AR</title><style>body{margin:0;background:#102237;color:white;font:14px Arial}#panel{position:fixed;z-index:3;top:8px;left:8px;background:#102237ed;padding:12px;border-radius:9px;width:min(290px,85vw);max-height:78vh;overflow:auto}label{display:block;margin:9px 0}input{width:100%}button{padding:9px;margin:3px;background:#256b95;border:0;border-radius:5px;color:white}#info{position:fixed;bottom:8px;left:8px;z-index:3;background:#102237dd;padding:8px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><div id="panel"><button id="hideMenu" type="button" aria-label="Hide controls" style="float:right">✕ Hide</button><b>TRADESIGHT · LIGHTHOUSE AR</b><p>Exploded construction · movable · resizable</p><label>Distance <span id="dv"></span> m<input id="distance" type="range" min="2" max="1000" value="35"></label><label>Height <span id="hv"></span> m<input id="height" type="range" min="-30" max="100" value="0"></label><label>Left / Right <span id="xv"></span> m<input id="horizontal" type="range" min="-250" max="250" value="0"></label><label>Model height <span id="sv"></span> m<input id="size" type="range" min="2" max="100" value="25"></label><label>Rotation <span id="rv"></span>°<input id="rotation" type="range" min="0" max="360" value="0"></label><label>Explode <span id="ev"></span>%<input id="explode" type="range" min="0" max="100" value="55"></label><button id="reset">Reset</button><button id="assembled">Assemble</button><button id="exploded">Explode</button><div id="ar"></div><small>AR requires Android Chrome, HTTPS and WebXR support. Distance is relative to camera, not GPS anchored.</small></div><button id="showMenu" type="button" style="display:none;position:fixed;top:8px;left:8px;z-index:5">☰ Controls</button><div id="info">Loading lighthouse model…</div><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{ARButton}from'three/addons/webxr/ARButton.js';
const panel=document.getElementById('panel'),showMenu=document.getElementById('showMenu');document.getElementById('hideMenu').onclick=()=>{panel.style.display='none';showMenu.style.display='block'};showMenu.onclick=()=>{panel.style.display='block';showMenu.style.display='none'};const scene=new THREE.Scene();scene.background=new THREE.Color(0x102237);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.01,3000);camera.position.set(28,20,34);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x30465b,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(20,40,20);scene.add(sun);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;const lighthouse=new THREE.Group();scene.add(lighthouse);const parts=[];const material=(color,metalness=0)=>new THREE.MeshStandardMaterial({color,metalness,roughness:.5,transparent:false,side:THREE.DoubleSide});const white=material(0xf0eee4),red=material(0xc74b42),dark=material(0x263744,.6),glass=material(0x82d2f0,.25),gold=material(0xf9d18b,.6),rock=material(0x787a72);function add(name,geometry,mat,x,y,z,dx=0,dy=0,dz=0){const m=new THREE.Mesh(geometry,mat);m.position.set(x,y,z);m.userData={name,base:new THREE.Vector3(x,y,z),offset:new THREE.Vector3(dx,dy,dz)};lighthouse.add(m);parts.push(m);return m}function cyl(name,top,bottom,h,mat,y,dx=0,dy=0,dz=0){return add(name,new THREE.CylinderGeometry(top,bottom,h,48),mat,0,y,0,dx,dy,dz)}function box(name,w,h,d,mat,x,y,z,dx=0,dy=0,dz=0){return add(name,new THREE.BoxGeometry(w,h,d),mat,x,y,z,dx,dy,dz)}
cyl('Rock foundation',6.8,7.8,1.3,rock,-.7,0,-3,0);cyl('Concrete base',4.3,4.6,1,white,.55,0,-1.8,0);for(let i=0;i<5;i++){cyl('Tower section '+(i+1),3.2-i*.28,3.48-i*.28,3.25,i%2?red:white,2.6+i*3.25,(i%2?1:-1)*1.6,i*.65,0);cyl('Internal floor '+(i+1),3.05-i*.28,3.05-i*.28,.12,dark,1+i*3.25,2,0,0);box('Window '+(i+1),.75,1.25,.15,glass,0,2.9+i*3.25,3.05-i*.28,0,0,2.5)}cyl('Observation deck',2.7,2.7,.55,dark,18.95,0,2,0);cyl('Lantern floor',2.35,2.35,.35,red,19.55,0,2.5,0);cyl('Glass lantern',2.0,2.0,3,glass,21.25,2,3,0);for(let i=0;i<8;i++){const a=i*Math.PI/4;box('Lantern mullion',.13,3,.13,dark,2*Math.cos(a),21.25,2*Math.sin(a),2*Math.cos(a),2,2*Math.sin(a))}cyl('Lantern roof',.3,2.5,1.6,red,23.55,0,4,0);cyl('Beacon',.9,.9,1.1,gold,21.3,-2,1,0);for(let i=0;i<14;i++){const a=i*Math.PI*2/14;add('Deck railing',new THREE.CylinderGeometry(.06,.06,1.2,8),dark,2.75*Math.cos(a),19.7,2.75*Math.sin(a),3*Math.cos(a),2,3*Math.sin(a))}box('Entrance',1.4,2.3,.18,dark,0,1.9,3.5,0,0,2);
const ids=['distance','height','horizontal','size','rotation','explode'];const defaults=[35,0,0,25,0,55];const inputs=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));let anchor=null;function update(){const d=+inputs.distance.value,h=+inputs.height.value,x=+inputs.horizontal.value,s=+inputs.size.value,r=+inputs.rotation.value,e=+inputs.explode.value/100;document.getElementById('dv').textContent=d;document.getElementById('hv').textContent=h;document.getElementById('xv').textContent=x;document.getElementById('sv').textContent=s;document.getElementById('rv').textContent=r;document.getElementById('ev').textContent=Math.round(e*100);for(const p of parts)p.position.copy(p.userData.base).addScaledVector(p.userData.offset,e);lighthouse.scale.setScalar(s/25);lighthouse.rotation.y=r*Math.PI/180;if(renderer.xr.isPresenting){if(anchor){const local=new THREE.Vector3(x,h,-d);local.applyQuaternion(anchor.quaternion);lighthouse.position.copy(anchor.position).add(local)}else lighthouse.position.set(x,h,-d)}else lighthouse.position.set(0,0,0)}ids.forEach(id=>inputs[id].addEventListener('input',update));document.getElementById('reset').onclick=()=>{ids.forEach((id,i)=>inputs[id].value=defaults[i]);update()};document.getElementById('assembled').onclick=()=>{inputs.explode.value=0;update()};document.getElementById('exploded').onclick=()=>{inputs.explode.value=100;update()};update();
document.getElementById('ar').appendChild(ARButton.createButton(renderer,{optionalFeatures:['local-floor','dom-overlay'],domOverlay:{root:document.body}}));renderer.xr.addEventListener('sessionstart',()=>{scene.background=null;const xrCamera=renderer.xr.getCamera();anchor=null;update();document.getElementById('info').textContent='AR active. Use distance, position and scale sliders.'});renderer.xr.addEventListener('sessionend',()=>{anchor=null;scene.background=new THREE.Color(0x102237);update();document.getElementById('info').textContent='3D viewer ready'});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{if(!renderer.xr.isPresenting)orbit.update();renderer.render(scene,camera)});document.getElementById('info').textContent='3D lighthouse ready · launch AR to position in surroundings';
</script></body></html>

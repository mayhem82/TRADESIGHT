<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT Model Viewer</title><style>
body{margin:0;background:#102237;color:white;font:16px Arial}#panel{position:fixed;z-index:5;top:8px;left:8px;background:#102237ed;padding:12px;border-radius:9px;width:min(320px,84vw);max-height:80vh;overflow:auto}label{display:block;margin:10px 0}input[type=range]{width:100%}button{padding:10px;margin:4px;background:#256b95;border:0;border-radius:5px;color:white;font:inherit}#info{position:fixed;bottom:8px;left:8px;z-index:5;background:#102237dd;padding:8px;max-width:90vw}canvas{display:block}a{color:#bde3ff}#showMenu{display:none;position:fixed;z-index:1001;top:8px;left:8px}#panel{z-index:1000}#hideMenu,#showMenu{touch-action:manipulation;min-height:48px;min-width:64px}body.menu-hidden #panel{display:none!important}body.menu-hidden #showMenu{display:block!important}small{display:block;line-height:1.4}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body>
<div id="panel"><button id="hideMenu" style="float:right">✕ Hide</button><a href="./model-library.html">← Library</a><h3 id="title">TRADESIGHT MODEL</h3><p id="description"></p>
<label>Distance <output id="dv">8</output> m<input id="distance" type="range" min="1" max="150" step=".5" value="8"></label>
<label>Height <output id="hv">0</output> m<input id="height" type="range" min="-30" max="100" step=".2" value="0"></label>
<label>Left / Right <output id="xv">0</output> m<input id="horizontal" type="range" min="-50" max="50" step=".2" value="0"></label>
<label>Model height <output id="sv">4</output> m<input id="size" type="range" min=".2" max="50" step=".2" value="4"></label>
<label>Rotation <output id="rv">0</output>°<input id="rotation" type="range" min="0" max="360" value="0"></label>
<div id="parameters"></div><button id="reset">Reset</button><button id="save">Save</button><button id="export">Export GLB</button><div id="ar"></div><small>Uses the Lighthouse AR camera-relative placement method. Distance and position are adjustable; not GPS or ground anchored.</small></div>
<button id="showMenu" type="button" aria-label="Show controls">☰ Controls</button><div id="info">Loading model…</div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{ARButton}from'three/addons/webxr/ARButton.js';
const id=new URLSearchParams(location.search).get('model')||'outline-windmill-v1';
const registry={'outline-windmill-v1':()=>import('./models/outline-windmill.js'),'chicken-enclosure-v1':()=>import('./models/chicken-enclosure.js')};
const info=document.getElementById('info');if(!registry[id])throw Error('Unknown model '+id);
const {metadata,createModel,updateModel}=await registry[id]();
document.getElementById('title').textContent='TRADESIGHT · '+metadata.name.toUpperCase();document.getElementById('description').textContent=metadata.description+(id==='outline-windmill-v1'?' — Camera-scene Outlines Mode is not implemented yet.':'');
const panel=document.getElementById('panel'),show=document.getElementById('showMenu');
document.getElementById('hideMenu').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();document.body.classList.add('menu-hidden')});show.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();document.body.classList.remove('menu-hidden')});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x102237);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.01,3000);camera.position.set(18,14,24);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x30465b,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(20,40,20);scene.add(sun);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;
let parameters={...metadata.parameters};try{parameters={...parameters,...JSON.parse(localStorage.getItem('tradesight-model-'+id)||'{}')}}catch{}
let model=createModel(parameters);scene.add(model);
const nativeBox=new THREE.Box3().setFromObject(model);const naturalHeight=Math.max(.1,nativeBox.max.y-nativeBox.min.y);
const ids=['distance','height','horizontal','size','rotation'];const inputs=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
inputs.size.value=Math.min(50,Math.max(.2,naturalHeight));const defaults={distance:8,height:0,horizontal:0,size:+inputs.size.value,rotation:0};
try{Object.assign(defaults,JSON.parse(localStorage.getItem('tradesight-view-'+id)||'{}'))}catch{}
for(const key of ids)inputs[key].value=defaults[key];
const paramPanel=document.getElementById('parameters');
for(const [key,val]of Object.entries(metadata.parameters)){const label=document.createElement('label');const out=document.createElement('output');out.textContent=parameters[key];label.append(document.createTextNode(key+' '),out);const slider=document.createElement('input');slider.type='range';slider.min=key==='finOpacity'?0:key==='rotationSpeed'?0:Math.max(.1,val*.2);slider.max=key==='finOpacity'?1:key==='rotationSpeed'?30:Math.max(val*2,val+1);slider.step=key==='finOpacity'?.01:.1;slider.value=parameters[key];slider.oninput=()=>{parameters[key]=+slider.value;out.textContent=slider.value;scene.remove(model);model=createModel(parameters);scene.add(model);update()};label.append(slider);paramPanel.append(label)}
let anchor=null;function update(){const d=+inputs.distance.value,h=+inputs.height.value,x=+inputs.horizontal.value,s=+inputs.size.value,r=+inputs.rotation.value;for(const [k,v]of [['distance','dv'],['height','hv'],['horizontal','xv'],['size','sv'],['rotation','rv']])document.getElementById(v).textContent=inputs[k].value;
model.scale.setScalar(s/naturalHeight);model.rotation.y=r*Math.PI/180;
if(renderer.xr.isPresenting){if(anchor){const local=new THREE.Vector3(x,h,-d).applyQuaternion(anchor.quaternion);model.position.copy(anchor.position).add(local)}else model.position.set(x,h,-d)}else model.position.set(0,0,0)}
ids.forEach(key=>inputs[key].addEventListener('input',update));update();
document.getElementById('reset').onclick=()=>{for(const k of ids)inputs[k].value=({distance:8,height:0,horizontal:0,size:naturalHeight,rotation:0})[k];update()};
document.getElementById('save').onclick=()=>{localStorage.setItem('tradesight-model-'+id,JSON.stringify(parameters));localStorage.setItem('tradesight-view-'+id,JSON.stringify(Object.fromEntries(ids.map(k=>[k,+inputs[k].value]))));info.textContent='Model settings saved'};
document.getElementById('export').onclick=async()=>{try{const {GLTFExporter}=await import('three/addons/exporters/GLTFExporter.js');new GLTFExporter().parse(model,glb=>{const url=URL.createObjectURL(new Blob([glb],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download=id+'.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},e=>info.textContent='Export error: '+e.message,{binary:true})}catch(e){info.textContent='Export failed: '+e.message}};
document.getElementById('ar').appendChild(ARButton.createButton(renderer,{optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}}));
renderer.xr.addEventListener('sessionstart',()=>{scene.background=null;anchor=null;update();info.textContent='AR active. Adjust distance, height, left/right and model size.'});
renderer.xr.addEventListener('sessionend',()=>{anchor=null;scene.background=new THREE.Color(0x102237);update();info.textContent='3D model ready'});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let last=null;renderer.setAnimationLoop(t=>{const delta=last===null?0:Math.min(.1,(t-last)/1000);last=t;if(updateModel)updateModel(model,delta);if(!renderer.xr.isPresenting)orbit.update();renderer.render(scene,camera)});info.textContent='3D model ready · launch AR to position in surroundings';
</script></body></html>

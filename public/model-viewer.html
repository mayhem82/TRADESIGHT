<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT — Model Viewer</title><style>body{margin:0;background:#101a28;color:#f1f5f8;font:18px system-ui}header,section{padding:12px 16px}a{color:#9bcfff}#viewport{height:56vh;min-height:340px;position:relative}canvas{display:block}button{font:inherit;background:#315c8b;color:white;border:1px solid #90a4b7;border-radius:8px;padding:10px;margin:5px}label{display:block;padding:8px}input{width:100%}#controls{padding:12px 16px;max-width:850px;margin:auto}#arButtons{display:flex;flex-wrap:wrap}#arLaunch{position:relative;min-height:125px}#arDiagnostic{font-size:16px;color:#d8e4f0;margin:6px 0}#enterAR{background:#17744c;font-weight:700}#arLaunch button{position:static!important;transform:none!important}small{color:#c4cbd4}#arOverlay{display:none;position:fixed;bottom:12px;left:12px;right:12px;z-index:99999;pointer-events:none}#arOverlay button{pointer-events:auto;background:#173c68;color:white;font-weight:700}body.ar-active #arOverlay{display:flex;justify-content:center;flex-wrap:wrap}body.ar-active #controls{display:none}</style><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.170.0","three/addons/":"https://esm.sh/three@0.170.0/examples/jsm/"}}</script></head><body><header><a href="./model-library.html">← Model Library</a><h1 id="title">TRADESIGHT Model Viewer</h1><small id="description"></small></header><div id="viewport"></div><div id="arOverlay"><button id="placeOverlay">Place / Reposition</button><button id="smallerOverlay">− Scale</button><button id="largerOverlay">+ Scale</button></div><section id="controls"><div id="arLaunch"><button id="enterAR" type="button">Enter camera AR</button><p id="arDiagnostic" role="status">Checking AR support…</p><a id="chromeLink" href="#" target="_blank" rel="noopener">Open viewer in browser</a></div><div id="arButtons"><button id="place">Place in AR</button><button id="smaller">Smaller</button><button id="larger">Larger</button><button id="export">Export GLB</button><button id="save">Save settings</button><button id="reset">Reset settings</button></div><p id="status">Loading model…</p><div id="parameters"></div><p><small>AR requires compatible Android Chrome with WebXR. Scan a surface and select Place in AR. Dimensions are concept values, not surveyed measurements or an engineering approval.</small></p></section><script>window.addEventListener("error",e=>{const s=document.getElementById("status");if(s)s.textContent="Viewer error: "+(e.message||"Script failed")});window.addEventListener("unhandledrejection",e=>{const s=document.getElementById("status");if(s)s.textContent="Model loading failed: "+String(e.reason?.message||e.reason)});</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const id=new URLSearchParams(location.search).get('model')||'chicken-enclosure-v1';
const registry={'chicken-enclosure-v1':()=>import('./models/chicken-enclosure.js'),'outline-windmill-v1':()=>import('./models/outline-windmill.js?v=2')};
if(!registry[id])throw Error('Unregistered model: '+id);
let metadata,createModel,updateModel;try{({metadata,createModel,updateModel}=await registry[id]())}catch(e){document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px;color:#ffb0a0">Model module failed to load. Check connection and refresh. '+String(e.message).replaceAll('<','&lt;')+'</p>');throw e}document.getElementById('title').textContent=metadata.name;document.getElementById('description').textContent=metadata.description;
const host=document.getElementById('viewport'),status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color(0x26374b);const camera=new THREE.PerspectiveCamera(55,1,.01,300);camera.position.set(20,15,23);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.xr.enabled=true;renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1,0);orbit.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x607080,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(8,20,10);scene.add(sun);
let parameters={...metadata.parameters};try{parameters={...parameters,...JSON.parse(localStorage.getItem('tradesight-model-'+id)||'{}')}}catch{}
let previousFrameTime=null;let model=null,hitSource=null,hitPose=null,placed=false,placeRequested=false,arScale=.15,needsInitialPlacement=false;const position=new THREE.Vector3();
function rebuild(){if(model){scene.remove(model);model.traverse(o=>{if(o.geometry)o.geometry.dispose()})}model=createModel(parameters);scene.add(model);if(renderer.xr.isPresenting){model.scale.setScalar(arScale);model.position.copy(position);model.visible=placed}}
const panel=document.getElementById('parameters');for(const [key,val]of Object.entries(metadata.parameters)){const label=document.createElement('label');label.textContent=key+' (m): ';const output=document.createElement('output');output.textContent=parameters[key];const input=document.createElement('input');input.type='range';input.min=key==='length'?4:key==='width'?2:.4;input.max=key==='length'?24:key==='width'?20:key==='wallHeight'?4:key==='roofRise'?2:5;input.step=.1;input.value=parameters[key];input.addEventListener('input',()=>{parameters[key]=Number(input.value);output.textContent=input.value;rebuild()});label.append(output,input);panel.append(label)}
try{rebuild()}catch(e){status.textContent='Model geometry failed: '+e.message;throw e}function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();
const enterAR=document.getElementById('enterAR'),diagnostic=document.getElementById('arDiagnostic');let arSupported=false;
async function checkAR(){if(!window.isSecureContext){diagnostic.textContent='AR unavailable: secure HTTPS context required';return}if(!navigator.xr){diagnostic.textContent='This browser does not expose WebXR. Open this page in Android Chrome (not an in-app browser).';return}try{arSupported=await navigator.xr.isSessionSupported('immersive-ar');diagnostic.textContent=arSupported?'AR supported. Tap Enter camera AR.':'Immersive AR is unavailable in this browser/device. Try Android Chrome and ensure Google Play Services for AR is installed.'}catch(e){diagnostic.textContent='AR support check failed: '+e.message}}
enterAR.onclick=async()=>{if(renderer.xr.isPresenting){await renderer.xr.getSession().end();return}diagnostic.textContent='Requesting AR camera session…';try{if(!navigator.xr)throw Error('WebXR unavailable in this browser');const session=await navigator.xr.requestSession('immersive-ar',{optionalFeatures:['local-floor','hit-test','dom-overlay'],domOverlay:{root:document.body}});await renderer.xr.setSession(session);diagnostic.textContent='AR session started'}catch(e){diagnostic.textContent='Cannot enter AR: '+e.message+'. Open in Android Chrome and check AR services.'}};
document.getElementById('chromeLink').href=location.href;checkAR();
renderer.xr.addEventListener('sessionstart',async()=>{placed=false;placeRequested=true;needsInitialPlacement=true;arScale=.15;model.visible=false;model.scale.setScalar(arScale);scene.background=null;orbit.enabled=false;document.body.classList.add('ar-active');try{const session=renderer.xr.getSession();const viewer=await session.requestReferenceSpace('viewer');hitSource=await session.requestHitTestSource({space:viewer});status.textContent='AR running: scan a surface, then press Place in AR'}catch(e){status.textContent='AR hit testing unavailable: '+e.message}});
renderer.xr.addEventListener('sessionend',()=>{document.body.classList.remove('ar-active');needsInitialPlacement=false;hitSource?.cancel();hitSource=null;hitPose=null;placed=false;placeRequested=false;model.visible=true;model.position.set(0,0,0);model.scale.setScalar(1);scene.background=new THREE.Color(0x26374b);orbit.enabled=true;status.textContent='3D viewer'});
function placeModel(){if(!renderer.xr.isPresenting){status.textContent='Enter AR first';return}if(hitPose){const p=hitPose.transform.position;position.set(p.x,p.y,p.z)}else{const xrCamera=renderer.xr.getCamera();const forward=new THREE.Vector3(0,0,-1).applyQuaternion(xrCamera.quaternion);position.copy(xrCamera.position).addScaledVector(forward,2);position.y-=.5}model.position.copy(position);model.scale.setScalar(arScale);model.visible=true;placed=true;needsInitialPlacement=false;status.textContent='Model placed in AR'}function smaller(){arScale=Math.max(.01,arScale*.75);if(renderer.xr.isPresenting)model.scale.setScalar(arScale)}function larger(){arScale=Math.min(3,arScale*1.25);if(renderer.xr.isPresenting)model.scale.setScalar(arScale)}document.getElementById('place').onclick=placeModel;document.getElementById('placeOverlay').onclick=placeModel;document.getElementById('smaller').onclick=smaller;document.getElementById('smallerOverlay').onclick=smaller;document.getElementById('larger').onclick=larger;document.getElementById('largerOverlay').onclick=larger;renderer.xr.getController(0).addEventListener('select',placeModel);
document.getElementById('save').onclick=()=>{localStorage.setItem('tradesight-model-'+id,JSON.stringify(parameters));status.textContent='Model parameters saved on this device'};
document.getElementById('reset').onclick=()=>{localStorage.removeItem('tradesight-model-'+id);location.reload()};
document.getElementById('export').onclick=async()=>{try{const {GLTFExporter}=await import('three/addons/exporters/GLTFExporter.js');new GLTFExporter().parse(model,glb=>{const url=URL.createObjectURL(new Blob([glb],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download=id+'.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},e=>status.textContent='Export error: '+e.message,{binary:true})}catch(e){status.textContent='Export unavailable: '+e.message}};
renderer.setAnimationLoop((time,frame)=>{const delta=previousFrameTime===null?0:Math.min(.1,Math.max(0,(time-previousFrameTime)/1000));previousFrameTime=time;if(updateModel&&model)updateModel(model,delta);if(frame&&hitSource){const hits=frame.getHitTestResults(hitSource);hitPose=hits.length?hits[0].getPose(renderer.xr.getReferenceSpace()):null}if(renderer.xr.isPresenting&&needsInitialPlacement){const xrCamera=renderer.xr.getCamera();if(xrCamera){const forward=new THREE.Vector3(0,0,-1).applyQuaternion(xrCamera.quaternion);position.copy(xrCamera.position).addScaledVector(forward,2);position.y-=.5;model.position.copy(position);model.scale.setScalar(arScale);model.visible=true;placed=true;needsInitialPlacement=false;status.textContent='Model visible in AR; use Place / Reposition to move it'}}if(!renderer.xr.isPresenting)orbit.update();renderer.render(scene,camera)});status.textContent='Model ready — 3D mode';
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT — Invisible Beholder Mirror AR</title><style>html,body{margin:0;overflow:hidden;background:#0b1420;color:white;font:16px system-ui}#controls{position:fixed;top:12px;left:12px;z-index:20;background:#15243cdd;border-radius:12px;padding:12px;max-width:260px}button,input{font:inherit}button{padding:10px;margin:4px;border-radius:8px;background:#73532e;color:white;border:1px solid #cfb178}#ar{position:fixed;right:14px;bottom:22px;z-index:25}#ar button{position:relative!important;bottom:auto!important;left:auto!important;right:auto!important;transform:none!important;min-width:135px!important;height:50px!important}label{display:block;margin:8px 0}input{width:100%}#status{position:fixed;bottom:12px;left:12px;max-width:56vw;background:#132238d9;padding:8px;border-radius:7px;z-index:19}#controls.hidden{display:none}#reveal{display:none;position:fixed;top:12px;left:12px;z-index:21}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><button id="reveal">☰ Controls</button><div id="controls"><b>INVISIBLE BEHOLDER MIRROR</b><p>Frameless mirror · camera AR prototype</p><button id="hide">Hide controls</button><button id="place">Place in front</button><label>Size <output id="sizeOut">1.0</output>×<input id="size" type="range" min=".1" max="5" step=".1" value="1"></label><label>Distance <output id="distanceOut">2</output> m<input id="distance" type="range" min=".5" max="12" step=".1" value="2"></label><label>Height <output id="heightOut">0</output> m<input id="height" type="range" min="-3" max="3" step=".1" value="0"></label><p style="font-size:13px">Camera-based reflective illusion, not a geometrically correct reconstructed reflection. The mirror has no frame or border.</p></div><div id="status">Loading mirror…</div><div id="ar"></div><script type="module">import * as THREE from 'three';import{ARButton}from'three/addons/webxr/ARButton.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x17293e);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,100);camera.position.set(0,0,4);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,premultipliedAlpha:false});renderer.setClearColor(0,0);renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);const mirror=new THREE.Group();scene.add(mirror);const geometry=new THREE.CircleGeometry(1,96);geometry.scale(1.65,1,1);const material=new THREE.MeshBasicMaterial({color:0xb4d7ed,metalness:0,roughness:1,side:THREE.DoubleSide,transparent:true,opacity:.8});const surface=new THREE.Mesh(geometry,material);mirror.add(surface);const shimmer=new THREE.Mesh(new THREE.CircleGeometry(1,96),new THREE.MeshBasicMaterial({color:0x80b5e0,transparent:true,opacity:.08,side:THREE.DoubleSide}));shimmer.scale.set(1.65,1,1);shimmer.position.z=.003;mirror.add(shimmer);let anchor=null;const size=document.getElementById('size'),distance=document.getElementById('distance'),height=document.getElementById('height');const status=document.getElementById('status');function update(){mirror.scale.setScalar(+size.value);document.getElementById('sizeOut').textContent=size.value;document.getElementById('distanceOut').textContent=distance.value;document.getElementById('heightOut').textContent=height.value;if(!renderer.xr.isPresenting)mirror.position.set(0,+height.value,0);else if(anchor)mirror.position.copy(anchor)}[size,distance,height].forEach(x=>x.addEventListener('input',update));function place(){const cam=renderer.xr.isPresenting?renderer.xr.getCamera():camera;const dir=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);anchor=cam.position.clone().addScaledVector(dir,+distance.value);anchor.y+=+height.value;mirror.position.copy(anchor);mirror.quaternion.copy(cam.quaternion);status.textContent='Mirror placed · frameless surface'}document.getElementById('place').onclick=place;document.getElementById('hide').onclick=()=>{document.getElementById('controls').classList.add('hidden');document.getElementById('reveal').style.display='block'};document.getElementById('reveal').onclick=()=>{document.getElementById('controls').classList.remove('hidden');document.getElementById('reveal').style.display='none'};const arButton=ARButton.createButton(renderer,{optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});document.getElementById('ar').appendChild(arButton);renderer.xr.addEventListener('sessionstart',()=>{scene.background=null;renderer.setClearAlpha(0);place();status.textContent='AR camera active · mirror prototype';});renderer.xr.addEventListener('sessionend',()=>{scene.background=new THREE.Color(0x17293e);anchor=null;mirror.position.set(0,0,0);status.textContent='3D preview'});window.addEventListener('unhandledrejection',e=>status.textContent='AR error: '+(e.reason?.message||e.reason));renderer.setAnimationLoop(()=>{if(renderer.xr.isPresenting){scene.background=null;renderer.setClearAlpha(0)}renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});update();status.textContent='Mirror ready · enter AR';</script></body></html>

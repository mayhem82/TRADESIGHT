<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT Mechanical Orrery AR</title><style>body{margin:0;background:#090f1e;color:#f3e8cf;font:14px Arial}#panel{position:fixed;top:8px;left:8px;z-index:5;width:min(285px,85vw);max-height:85vh;overflow:auto;background:#142033ef;border:1px solid #92754b;border-radius:10px;padding:12px}button{background:#73532e;color:white;border:1px solid #bb975c;border-radius:6px;padding:9px;margin:3px}label{display:block;margin:12px 0}input{width:100%}#show{display:none;position:fixed;top:8px;left:8px;z-index:6}#status{position:fixed;bottom:8px;left:8px;z-index:4;background:#142033d9;padding:8px;border-radius:7px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><button id="show">☰ Controls</button><div id="panel"><button id="hide" style="float:right">✕ Hide</button><b>TRADESIGHT · ORRERY</b><p>Animated mechanical solar system</p><button id="pause">Pause</button><button id="reset">Reset</button><label>Orbital speed <span id="speedv">1</span>×<input id="speed" type="range" min="0" max="5" value="1" step=".1"></label><label>Scale <span id="scalev">1</span>×<input id="scale" type="range" min=".1" max="5" value="1" step=".1"></label><label>Distance <span id="distancev">5</span> m<input id="distance" type="range" min="1" max="150" value="5"></label><label>Horizontal <span id="horizontalv">0</span> m<input id="horizontal" type="range" min="-40" max="40" value="0"></label><label>Height <span id="heightv">0</span> m<input id="height" type="range" min="-20" max="40" value="0"></label><label>Explode <span id="explodev">0</span>%<input id="explode" type="range" min="0" max="100" value="0"></label><div id="ar"></div><small>AR uses phone camera on supported HTTPS Android Chrome. Relative placement, not geographic anchoring.</small></div><div id="status">Loading 3D orrery…</div><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{ARButton}from'three/addons/webxr/ARButton.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x090f1e);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.01,1000);camera.position.set(9,9,12);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffedc7,0x2b344d,2));const light=new THREE.PointLight(0xffd28b,100,80);light.position.set(0,2,0);scene.add(light);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;const system=new THREE.Group();scene.add(system);const brass=new THREE.MeshStandardMaterial({color:0xcba15b,metalness:.85,roughness:.25}),bronze=new THREE.MeshStandardMaterial({color:0x76532e,metalness:.8,roughness:.3}),iron=new THREE.MeshStandardMaterial({color:0x29343c,metalness:.8,roughness:.3});function mesh(g,m,parent=system,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);parent.add(o);return o}mesh(new THREE.CylinderGeometry(1.8,2,.25,64),bronze,system,0,-1.3,0);mesh(new THREE.CylinderGeometry(.24,.33,1.5,32),brass,system,0,-.45,0);mesh(new THREE.TorusGeometry(1.65,.065,12,80),brass,system,0,-1.12,0).rotation.x=Math.PI/2;const sun=mesh(new THREE.SphereGeometry(.53,32,24),new THREE.MeshStandardMaterial({color:0xffc464,emissive:0xff8b16,emissiveIntensity:2}),system,0,.9,0);const bodies=[['Mercury',.7,.09,0x99938c,4.15],['Venus',1.12,.15,0xd3ad7d,1.62],['Earth',1.58,.17,0x377cc6,1],['Mars',2.03,.13,0xc65c3a,.53],['Jupiter',2.7,.35,0xc5a178,.084],['Saturn',3.5,.29,0xd9c08b,.034],['Uranus',4.15,.22,0x78c6d0,.012],['Neptune',4.75,.21,0x4967c4,.006]];const pivots=[],gears=[];for(let i=0;i<bodies.length;i++){const [name,radius,size,color,rate]=bodies[i];const pivot=new THREE.Group();pivot.position.y=.9+i*.02;system.add(pivot);pivots.push({pivot,rate});const ring=mesh(new THREE.TorusGeometry(radius,.018,8,96),brass,pivot);ring.rotation.x=Math.PI/2;const arm=mesh(new THREE.BoxGeometry(radius,.035,.04),brass,pivot,radius/2,0,0);const planet=mesh(new THREE.SphereGeometry(size,20,16),new THREE.MeshStandardMaterial({color,metalness:.18,roughness:.6}),pivot,radius,0,0);planet.userData.name=name;if(name==='Saturn'){const ring=mesh(new THREE.TorusGeometry(size*1.7,.035,8,40),brass,pivot,radius,0,0);ring.rotation.x=.35}const gear=mesh(new THREE.CylinderGeometry(.27+i*.06,.27+i*.06,.055,32),i%2?brass:bronze,system,0,-.98+i*.085,0);gears.push({gear,rate});for(let t=0;t<16;t++){const a=t*Math.PI/8;mesh(new THREE.BoxGeometry(.09,.07,.12),brass,gear,Math.cos(a)*(.27+i*.06),0,Math.sin(a)*(.27+i*.06)).rotation.y=-a}}const controls=['speed','scale','distance','horizontal','height','explode'];const el=Object.fromEntries(controls.map(id=>[id,document.getElementById(id)]));let playing=true,phase=0;document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'Pause':'Play'};document.getElementById('reset').onclick=()=>{[1,1,5,0,0,0].forEach((v,i)=>el[controls[i]].value=v);phase=0;update()};document.getElementById('hide').onclick=()=>{document.getElementById('panel').style.display='none';document.getElementById('show').style.display='block'};document.getElementById('show').onclick=()=>{document.getElementById('panel').style.display='block';document.getElementById('show').style.display='none'};function update(){for(const id of controls)document.getElementById(id+'v').textContent=el[id].value;system.scale.setScalar(+el.scale.value);if(renderer.xr.isPresenting)system.position.set(+el.horizontal.value,+el.height.value,-Number(el.distance.value));else system.position.set(0,0,0);const e=+el.explode.value/100;for(let i=0;i<pivots.length;i++)pivots[i].pivot.position.y=.9+i*.02+e*i*.4;for(let i=0;i<gears.length;i++)gears[i].gear.position.y=-.98+i*.085-e*i*.16}controls.forEach(id=>el[id].oninput=update);update();document.getElementById('ar').appendChild(ARButton.createButton(renderer,{optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}}));renderer.xr.addEventListener('sessionstart',()=>{scene.background=null;update();document.getElementById('status').textContent='AR active · adjust distance, scale and position'});renderer.xr.addEventListener('sessionend',()=>{scene.background=new THREE.Color(0x090f1e);update();document.getElementById('status').textContent='3D viewer ready'});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=0;renderer.setAnimationLoop(t=>{const dt=Math.min((t-last)/1000||0,.1);last=t;if(playing)phase+=dt*Number(el.speed.value);pivots.forEach(({pivot,rate})=>pivot.rotation.y=phase*rate*.25);gears.forEach(({gear,rate})=>gear.rotation.y=-phase*rate*.5);if(!renderer.xr.isPresenting)orbit.update();renderer.render(scene,camera)});document.getElementById('status').textContent='Animated orrery ready';</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT Sound Wall Cube AR</title><style>html,body{margin:0;overflow:hidden;background:#101a29;color:#fff;font:16px system-ui}#panel{position:fixed;top:12px;left:12px;z-index:20;background:#15243de9;border-radius:12px;padding:12px;width:min(290px,80vw);max-height:70vh;overflow:auto}button,input{font:inherit}button{padding:9px;margin:3px;background:#78552d;color:white;border:1px solid #c9a675;border-radius:8px}label{display:block;margin:8px 0}input{width:100%}#ar{position:fixed;right:12px;bottom:18px;z-index:25}#ar button{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;min-width:120px!important;height:48px!important}#status{position:fixed;left:12px;bottom:12px;background:#10213bdb;padding:9px;border-radius:9px;z-index:18;max-width:58vw}#show{display:none;position:fixed;top:12px;left:12px;z-index:21}#movebar{display:none;position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:1000;width:min(360px,96vw);text-align:center;background:#122039dd;padding:7px;border-radius:12px}#movebar button{font-size:16px;padding:12px;min-width:52px;touch-action:manipulation}body.xr #movebar{display:block}body.xr #panel{display:none}body.xr #show{display:block}body.xr #status{bottom:12px;max-width:75vw}body.xr #ar{bottom:12px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><button id="show">☰ Controls</button><div id="panel"><b>SOUND WALL CUBE · VIP ZONE</b><p>AR spatial audio-zone prototype</p><button id="hide">Hide menu</button><button id="place">Place on green circle</button><button id="farther">Move farther +0.5m</button><button id="nearer">Move nearer −0.5m</button><label>Placement distance <output id="distOut">3</output> m<input id="dist" type="range" min="0.5" max="12" step="0.25" value="3"></label><p style="font-size:13px">Scan the tabletop or ground for the green circle, then tap PLACE / MOVE HERE.</p><label>Width <output id="wOut">3</output> m<input id="w" type="range" min="1" max="10" step=".25" value="3"></label><label>Depth <output id="dOut">3</output> m<input id="d" type="range" min="1" max="10" step=".25" value="3"></label><label>Height <output id="hOut">2.5</output> m<input id="h" type="range" min="1" max="5" step=".25" value="2.5"></label><label>Visual mode <select id="visual"><option value="tint">Audio Colour Tint</option><option value="outline">Outline</option><option value="cartoon">Cartoon</option><option value="both">Outline + Cartoon</option></select></label><label>Outline thickness <output id="thickOut">2</output>px<input id="thick" type="range" min="1" max="10" step=".5" value="2"></label><label>Outline opacity <output id="edgeOut">100</output>%<input id="edgeOpacity" type="range" min="0" max="100" value="100"></label><label>Outline colour <input id="edgeColor" type="color" value="#ffffff"></label><label>Cartoon levels <output id="levelsOut">6</output><input id="levels" type="range" min="2" max="16" value="6"></label><label>Audio colour tint strength <output id="tintOut">60</output>%<input id="tint" type="range" min="0" max="100" value="60"></label><label>Colour smoothing <output id="smoothOut">70</output>%<input id="smooth" type="range" min="0" max="95" value="70"></label><button id="audio">Enable audio colour tint</button><p style="font-size:13px">Microphone drives bass/violet, mid/cyan and treble/pink tint. The cube is a visible AR zone, not a physical sound barrier.</p></div><div id="movebar"><button id="quickPlace">PLACE / MOVE HERE</button><div><button id="left">←</button><button id="up">↑</button><button id="down">↓</button><button id="right">→</button><button id="forward">Farther</button><button id="back">Nearer</button></div></div><div id="status">3D zone ready</div><div id="ar"></div><script type="module">import * as THREE from 'three';import{ARButton}from'three/addons/webxr/ARButton.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x12253a);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,100);camera.position.set(0,2,7);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,premultipliedAlpha:false});renderer.setClearColor(0,0);renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);const placementRing=new THREE.Mesh(new THREE.RingGeometry(.10,.16,48),new THREE.MeshBasicMaterial({color:0x00ff44,side:THREE.DoubleSide,depthTest:false,depthWrite:false,transparent:false}));placementRing.renderOrder=999;placementRing.rotation.x=-Math.PI/2;placementRing.visible=false;scene.add(placementRing);let hitTestSource=null,latestHitPose=null;const zone=new THREE.Group();zone.visible=false;scene.add(zone);const fill=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0x3ed9e6,transparent:true,opacity:.07,depthWrite:false,side:THREE.DoubleSide}));zone.add(fill);const cartoonMaterial=new THREE.MeshBasicMaterial({color:0x44c3c8,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false});const cartoonFaces=new THREE.Mesh(new THREE.BoxGeometry(1.002,1.002,1.002),cartoonMaterial);zone.add(cartoonFaces);const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),new THREE.LineBasicMaterial({color:0x40e7e2,transparent:true,opacity:.8}));zone.add(edge);let anchor=false,pendingPlace=false,inside=false,audioContext,analyser,micStream,frequencyData,audioEnabled=false,tintHue=190,tintLevel=0;const el=id=>document.getElementById(id);function updateVisual(){const mode=el('visual').value;const outline=mode==='outline'||mode==='both',cartoon=mode==='cartoon'||mode==='both';edge.visible=outline;cartoonFaces.visible=cartoon;fill.visible=mode==='tint';edge.material.color.set(el('edgeColor').value);edge.material.opacity=Number(el('edgeOpacity').value)/100;cartoonMaterial.color.setHSL(tintHue/360,.85,Math.round(.55*(Number(el('levels').value)-1))/(Number(el('levels').value)-1));cartoonMaterial.opacity=.55;el('thickOut').textContent=el('thick').value;el('edgeOut').textContent=el('edgeOpacity').value;el('levelsOut').textContent=el('levels').value}for(const id of ['visual','thick','edgeOpacity','edgeColor','levels'])el(id).addEventListener('input',updateVisual);function dimensions(){const w=+el('w').value,d=+el('d').value,h=+el('h').value;zone.scale.set(w,h,d);el('wOut').textContent=w;el('dOut').textContent=d;el('hOut').textContent=h;return {w,d,h}}['w','d','h'].forEach(id=>el(id).addEventListener('input',dimensions));dimensions();updateVisual();function place(){el('status').textContent='Place requested';if(renderer.xr.isPresenting){placeFromXRCamera();return}zone.position.set(0,zone.scale.y/2,-Number(el('dist').value));anchor=true;zone.visible=true;el('status').textContent='Preview cube placed'}function placeFromXRCamera(){if(renderer.xr.isPresenting){if(!latestHitPose){el("status").textContent="Scan a surface until green circle appears";return}const t=latestHitPose.transform.position;zone.position.set(t.x,t.y+zone.scale.y/2,t.z);zone.rotation.y=0;placementRing.visible=false;anchor=true;zone.visible=true;el("status").textContent="Cube placed on detected surface · tap PLACE again to move";return}const xrCam=renderer.xr.getCamera(camera);const cam=xrCam.cameras&&xrCam.cameras.length?xrCam.cameras[0]:xrCam;cam.updateMatrixWorld(true);const p=new THREE.Vector3(),q=new THREE.Quaternion();cam.getWorldPosition(p);cam.getWorldQuaternion(q);if(!Number.isFinite(p.x)||!Number.isFinite(p.y)||!Number.isFinite(p.z))return;const forward=new THREE.Vector3(0,0,-1).applyQuaternion(q).normalize();const distance=Number(el('dist').value);const target=p.clone().addScaledVector(forward,distance);zone.position.copy(target);zone.position.y+=zone.scale.y/2;zone.rotation.y=Math.atan2(-forward.x,-forward.z);anchor=true;pendingPlace=false;el('status').textContent='Cube placed '+distance+'m ahead at aimed height'} el('place').onclick=place;el('quickPlace').onclick=place;el('quickPlace').addEventListener('touchend',e=>{e.preventDefault();place()},{passive:false});const move=(x,y,z)=>{if(!anchor){place();return}const q=new THREE.Quaternion();(renderer.xr.isPresenting?renderer.xr.getCamera():camera).getWorldQuaternion(q);const right=new THREE.Vector3(1,0,0).applyQuaternion(q);right.y=0;right.normalize();const front=new THREE.Vector3(0,0,-1).applyQuaternion(q);front.y=0;front.normalize();zone.position.addScaledVector(right,x).addScaledVector(front,z);zone.position.y+=y;el('status').textContent='Cube moved · tap PLACE to reposition'};for(const [id,x,y,z] of [['left',-.25,0,0],['right',.25,0,0],['up',0,.25,0],['down',0,-.25,0],['forward',0,0,.5],['back',0,0,-.5]])el(id).onclick=()=>move(x,y,z);el('dist').oninput=()=>el('distOut').textContent=el('dist').value;el('farther').onclick=()=>{el('dist').value=Math.min(12,Number(el('dist').value)+.5);el('dist').oninput();place()};el('nearer').onclick=()=>{el('dist').value=Math.max(.5,Number(el('dist').value)-.5);el('dist').oninput();place()};el('hide').onclick=()=>{el('panel').style.display='none';el('show').style.display='block'};el('show').onclick=()=>{el('panel').style.display='block';el('show').style.display='none'};el('audio').onclick=async()=>{try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioContext=new AudioContext();const source=audioContext.createMediaStreamSource(micStream);analyser=audioContext.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.7;source.connect(analyser);frequencyData=new Uint8Array(analyser.frequencyBinCount);await audioContext.resume();audioEnabled=true;el('audio').textContent='Audio colour tint active';el('status').textContent='Microphone active · colour tint ready'}catch(error){el('status').textContent='Microphone unavailable: '+error.message}};function band(lo,hi){const hz=audioContext.sampleRate/analyser.fftSize;const from=Math.max(0,Math.floor(lo/hz)),to=Math.min(frequencyData.length,Math.ceil(hi/hz));let sum=0;for(let i=from;i<to;i++)sum+=frequencyData[i];return sum/Math.max(1,to-from)/255}function animateTint(){if(!audioEnabled)return;analyser.getByteFrequencyData(frequencyData);const bass=band(20,150),mid=band(150,2000),treble=band(2000,8000);const x=bass*Math.cos(262*Math.PI/180)+mid*Math.cos(185*Math.PI/180)+treble*Math.cos(325*Math.PI/180),y=bass*Math.sin(262*Math.PI/180)+mid*Math.sin(185*Math.PI/180)+treble*Math.sin(325*Math.PI/180);const target=(Math.atan2(y,x)*180/Math.PI+360)%360;const smoothing=1-(+el('smooth').value/100);tintHue+=(((target-tintHue+540)%360)-180)*smoothing;tintLevel+=(Math.min(1,(bass+mid+treble)*1.6)-tintLevel)*smoothing;const strength=+el('tint').value/100;fill.material.color.setHSL(tintHue/360,.95,.52);fill.material.opacity=.06+tintLevel*strength*.65;if(el('visual').value==='tint'){edge.material.color.setHSL(tintHue/360,1,.55);edge.material.opacity=.5+tintLevel*.5}else{edge.material.color.set(el('edgeColor').value);edge.material.opacity=Number(el('edgeOpacity').value)/100}const levels=Number(el('levels').value);cartoonMaterial.color.setHSL(tintHue/360,.85,Math.round((.3+tintLevel*.6)*(levels-1))/(levels-1))}for(const id of ['tint','smooth'])el(id).addEventListener('input',()=>{el(id==='tint'?'tintOut':'smoothOut').textContent=el(id).value});const arButton=ARButton.createButton(renderer,{requiredFeatures:['hit-test','dom-overlay'],domOverlay:{root:document.body}});el('ar').appendChild(arButton);const xrController=renderer.xr.getController(0);xrController.addEventListener('select',()=>{if(renderer.xr.isPresenting)place()});scene.add(xrController);renderer.xr.addEventListener('sessionstart',async()=>{try{const session=renderer.xr.getSession();const viewer=await session.requestReferenceSpace('viewer');hitTestSource=await session.requestHitTestSource({space:viewer});el('status').textContent='Scan for green circle'}catch(e){el('status').textContent='Surface tracking unavailable: '+e.message}scene.background=null;renderer.setClearAlpha(0);pendingPlace=false;anchor=false;zone.visible=false;document.body.classList.add('xr');el('status').textContent=hitTestSource?'Move phone slowly to detect table or ground':'Surface detection not ready'});renderer.xr.addEventListener('sessionend',()=>{scene.background=new THREE.Color(0x12253a);anchor=false;pendingPlace=false;inside=false;zone.visible=false;placementRing.visible=false;if(hitTestSource)hitTestSource.cancel();hitTestSource=null;latestHitPose=null;document.body.classList.remove('xr');el('status').textContent='AR ended'});const local=new THREE.Vector3();renderer.setAnimationLoop((time,frame)=>{if(frame&&renderer.xr.isPresenting&&hitTestSource){const hits=frame.getHitTestResults(hitTestSource);latestHitPose=hits.length?hits[0].getPose(renderer.xr.getReferenceSpace()):null;placementRing.visible=!!latestHitPose;if(latestHitPose&&!anchor)el('status').textContent='Green circle found · tap PLACE / MOVE HERE';if(latestHitPose){const p=latestHitPose.transform.position;placementRing.position.set(p.x,p.y+.008,p.z)}}animateTint();if(renderer.xr.isPresenting){scene.background=null;renderer.setClearAlpha(0);if(anchor){const cam=renderer.xr.getCamera();zone.updateMatrixWorld(true);local.copy(cam.position);zone.worldToLocal(local);const now=Math.abs(local.x)<=.5&&Math.abs(local.y)<=.5&&Math.abs(local.z)<=.5;if(now!==inside){inside=now;el('status').textContent=inside?'INSIDE VIP ZONE · audio colour tint':'OUTSIDE VIP ZONE · tint remains on cube'}}}renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>

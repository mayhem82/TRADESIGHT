<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT Sound Wall Cube AR</title><style>html,body{margin:0;overflow:hidden;background:#101a29;color:#fff;font:16px system-ui}#panel{position:fixed;top:12px;left:12px;z-index:20;background:#15243de9;border-radius:12px;padding:12px;width:min(290px,80vw);max-height:70vh;overflow:auto}button,input{font:inherit}button{padding:9px;margin:3px;background:#78552d;color:white;border:1px solid #c9a675;border-radius:8px}label{display:block;margin:8px 0}input{width:100%}#ar{position:fixed;right:12px;bottom:18px;z-index:25}#ar button{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;min-width:120px!important;height:48px!important}#status{position:fixed;left:12px;bottom:12px;background:#10213bdb;padding:9px;border-radius:9px;z-index:18;max-width:58vw}#show{display:none;position:fixed;top:12px;left:12px;z-index:21}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><button id="show">☰ Controls</button><div id="panel"><b>SOUND WALL CUBE · VIP ZONE</b><p>AR spatial audio-zone prototype</p><button id="hide">Hide menu</button><button id="place">Place cube at crosshair</button><button id="farther">Move farther +0.5m</button><button id="nearer">Move nearer −0.5m</button><label>Placement distance <output id="distOut">3</output> m<input id="dist" type="range" min="0.5" max="12" step="0.25" value="3"></label><p style="font-size:13px">Aim at the table, then tap Place cube at crosshair. The cube bottom sits at the aimed height.</p><label>Width <output id="wOut">3</output> m<input id="w" type="range" min="1" max="10" step=".25" value="3"></label><label>Depth <output id="dOut">3</output> m<input id="d" type="range" min="1" max="10" step=".25" value="3"></label><label>Height <output id="hOut">2.5</output> m<input id="h" type="range" min="1" max="5" step=".25" value="2.5"></label><label>Audio colour tint strength <output id="tintOut">60</output>%<input id="tint" type="range" min="0" max="100" value="60"></label><label>Colour smoothing <output id="smoothOut">70</output>%<input id="smooth" type="range" min="0" max="95" value="70"></label><button id="audio">Enable audio colour tint</button><p style="font-size:13px">Microphone drives bass/violet, mid/cyan and treble/pink tint. The cube is a visible AR zone, not a physical sound barrier.</p></div><div id="reticle" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;color:#fff;z-index:12;pointer-events:none;text-shadow:0 0 5px #000">＋</div><div id="status">3D zone ready</div><div id="ar"></div><script type="module">import * as THREE from 'three';import{ARButton}from'three/addons/webxr/ARButton.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x12253a);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,100);camera.position.set(0,2,7);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,premultipliedAlpha:false});renderer.setClearColor(0,0);renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);const zone=new THREE.Group();scene.add(zone);const fill=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0x3ed9e6,transparent:true,opacity:.07,depthWrite:false,side:THREE.DoubleSide}));zone.add(fill);const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),new THREE.LineBasicMaterial({color:0x40e7e2,transparent:true,opacity:.8}));zone.add(edge);let anchor=false,pendingPlace=false,inside=false,audioContext,analyser,micStream,frequencyData,audioEnabled=false,tintHue=190,tintLevel=0;const el=id=>document.getElementById(id);function dimensions(){const w=+el('w').value,d=+el('d').value,h=+el('h').value;zone.scale.set(w,h,d);el('wOut').textContent=w;el('dOut').textContent=d;el('hOut').textContent=h;return {w,d,h}}['w','d','h'].forEach(id=>el(id).addEventListener('input',dimensions));dimensions();function place(){if(renderer.xr.isPresenting){placeFromXRCamera();return}zone.position.set(0,zone.scale.y/2,-Number(el('dist').value));anchor=true;el('status').textContent='Preview cube placed'}function placeFromXRCamera(){const cam=renderer.xr.getCamera();const p=new THREE.Vector3(),q=new THREE.Quaternion();cam.getWorldPosition(p);cam.getWorldQuaternion(q);if(!Number.isFinite(p.x)||!Number.isFinite(p.y)||!Number.isFinite(p.z))return;const forward=new THREE.Vector3(0,0,-1).applyQuaternion(q).normalize();const distance=Number(el('dist').value);const target=p.clone().addScaledVector(forward,distance);zone.position.copy(target);zone.position.y+=zone.scale.y/2;zone.rotation.y=Math.atan2(-forward.x,-forward.z);anchor=true;pendingPlace=false;el('status').textContent='Cube placed '+distance+'m ahead at aimed height'} el('place').onclick=place;el('dist').oninput=()=>el('distOut').textContent=el('dist').value;el('farther').onclick=()=>{el('dist').value=Math.min(12,Number(el('dist').value)+.5);el('dist').oninput();place()};el('nearer').onclick=()=>{el('dist').value=Math.max(.5,Number(el('dist').value)-.5);el('dist').oninput();place()};el('hide').onclick=()=>{el('panel').style.display='none';el('show').style.display='block'};el('show').onclick=()=>{el('panel').style.display='block';el('show').style.display='none'};el('audio').onclick=async()=>{try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioContext=new AudioContext();const source=audioContext.createMediaStreamSource(micStream);analyser=audioContext.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.7;source.connect(analyser);frequencyData=new Uint8Array(analyser.frequencyBinCount);await audioContext.resume();audioEnabled=true;el('audio').textContent='Audio colour tint active';el('status').textContent='Microphone active · colour tint ready'}catch(error){el('status').textContent='Microphone unavailable: '+error.message}};function band(lo,hi){const hz=audioContext.sampleRate/analyser.fftSize;const from=Math.max(0,Math.floor(lo/hz)),to=Math.min(frequencyData.length,Math.ceil(hi/hz));let sum=0;for(let i=from;i<to;i++)sum+=frequencyData[i];return sum/Math.max(1,to-from)/255}function animateTint(){if(!audioEnabled)return;analyser.getByteFrequencyData(frequencyData);const bass=band(20,150),mid=band(150,2000),treble=band(2000,8000);const x=bass*Math.cos(262*Math.PI/180)+mid*Math.cos(185*Math.PI/180)+treble*Math.cos(325*Math.PI/180),y=bass*Math.sin(262*Math.PI/180)+mid*Math.sin(185*Math.PI/180)+treble*Math.sin(325*Math.PI/180);const target=(Math.atan2(y,x)*180/Math.PI+360)%360;const smoothing=1-(+el('smooth').value/100);tintHue+=(((target-tintHue+540)%360)-180)*smoothing;tintLevel+=(Math.min(1,(bass+mid+treble)*1.6)-tintLevel)*smoothing;const strength=+el('tint').value/100;fill.material.color.setHSL(tintHue/360,.95,.52);fill.material.opacity=.06+tintLevel*strength*.65;edge.material.color.setHSL(tintHue/360,1,.55);edge.material.opacity=.5+tintLevel*.5}for(const id of ['tint','smooth'])el(id).addEventListener('input',()=>{el(id==='tint'?'tintOut':'smoothOut').textContent=el(id).value});const arButton=ARButton.createButton(renderer,{optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});el('ar').appendChild(arButton);renderer.xr.addEventListener('sessionstart',()=>{scene.background=null;renderer.setClearAlpha(0);pendingPlace=false;anchor=false;el('status').textContent='AR ready · aim at table and tap Place cube at crosshair'});renderer.xr.addEventListener('sessionend',()=>{scene.background=new THREE.Color(0x12253a);anchor=false;pendingPlace=false;inside=false;el('status').textContent='AR ended'});const local=new THREE.Vector3();renderer.setAnimationLoop(()=>{animateTint();if(renderer.xr.isPresenting){scene.background=null;renderer.setClearAlpha(0);if(anchor){const cam=renderer.xr.getCamera();zone.updateMatrixWorld(true);local.copy(cam.position);zone.worldToLocal(local);const now=Math.abs(local.x)<=.5&&Math.abs(local.y)<=.5&&Math.abs(local.z)<=.5;if(now!==inside){inside=now;el('status').textContent=inside?'INSIDE VIP ZONE · audio colour tint':'OUTSIDE VIP ZONE · tint remains on cube'}}}renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT Sound Wall Cube AR</title><style>html,body{margin:0;overflow:hidden;background:#101a29;color:#fff;font:16px system-ui}#panel{position:fixed;top:12px;left:12px;z-index:20;background:#15243de9;border-radius:12px;padding:12px;width:min(290px,80vw);max-height:70vh;overflow:auto}button,input{font:inherit}button{padding:9px;margin:3px;background:#78552d;color:white;border:1px solid #c9a675;border-radius:8px}label{display:block;margin:8px 0}input{width:100%}#ar{position:fixed;right:12px;bottom:18px;z-index:25}#ar button{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;min-width:120px!important;height:48px!important}#status{position:fixed;left:12px;bottom:12px;background:#10213bdb;padding:9px;border-radius:9px;z-index:18;max-width:58vw}#show{display:none;position:fixed;top:12px;left:12px;z-index:21}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><button id="show">☰ Controls</button><div id="panel"><b>SOUND WALL CUBE · VIP ZONE</b><p>AR spatial audio-zone prototype</p><button id="hide">Hide menu</button><button id="place">Place zone ahead</button><label>Width <output id="wOut">3</output> m<input id="w" type="range" min="1" max="10" step=".25" value="3"></label><label>Depth <output id="dOut">3</output> m<input id="d" type="range" min="1" max="10" step=".25" value="3"></label><label>Height <output id="hOut">2.5</output> m<input id="h" type="range" min="1" max="5" step=".25" value="2.5"></label><label>Zone audio effect <select id="effect"><option value="lowpass">Muffled outside / clear inside</option><option value="gain">Quiet outside / louder inside</option></select></label><button id="audio">Enable demo tone</button><p style="font-size:13px">Headphones recommended. AR checks the phone's position against the cube, not other people's positions. This demonstrates a virtual audio zone; it does not physically contain venue sound.</p></div><div id="status">3D zone ready</div><div id="ar"></div><script type="module">import * as THREE from 'three';import{ARButton}from'three/addons/webxr/ARButton.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x12253a);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,100);camera.position.set(0,2,7);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,premultipliedAlpha:false});renderer.setClearColor(0,0);renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);const zone=new THREE.Group();scene.add(zone);const fill=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0x3ed9e6,transparent:true,opacity:.07,depthWrite:false,side:THREE.DoubleSide}));zone.add(fill);const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),new THREE.LineBasicMaterial({color:0x40e7e2,transparent:true,opacity:.8}));zone.add(edge);let anchor=false,inside=false,audioContext,osc,gain,filter,audioEnabled=false;const el=id=>document.getElementById(id);function dimensions(){const w=+el('w').value,d=+el('d').value,h=+el('h').value;zone.scale.set(w,h,d);el('wOut').textContent=w;el('dOut').textContent=d;el('hOut').textContent=h;return {w,d,h}}['w','d','h'].forEach(id=>el(id).addEventListener('input',dimensions));dimensions();function place(){const cam=renderer.xr.isPresenting?renderer.xr.getCamera():camera;const direction=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);direction.y=0;direction.normalize();zone.position.copy(cam.position).addScaledVector(direction,3);zone.position.y=zone.scale.y/2;zone.rotation.y=Math.atan2(-direction.x,-direction.z);anchor=true;el('status').textContent='VIP zone placed · move phone inside to test'}el('place').onclick=place;el('hide').onclick=()=>{el('panel').style.display='none';el('show').style.display='block'};el('show').onclick=()=>{el('panel').style.display='block';el('show').style.display='none'};el('audio').onclick=async()=>{if(!audioContext){audioContext=new AudioContext();osc=audioContext.createOscillator();osc.type='sawtooth';osc.frequency.value=180;filter=audioContext.createBiquadFilter();filter.type='lowpass';gain=audioContext.createGain();gain.gain.value=.06;osc.connect(filter).connect(gain).connect(audioContext.destination);osc.start()}await audioContext.resume();audioEnabled=true;el('audio').textContent='Demo tone enabled';applyEffect()};function applyEffect(){if(!audioEnabled)return;const t=audioContext.currentTime;if(el('effect').value==='lowpass'){filter.frequency.setTargetAtTime(inside?8000:350,t,.18);gain.gain.setTargetAtTime(.06,t,.18)}else{filter.frequency.setTargetAtTime(8000,t,.18);gain.gain.setTargetAtTime(inside?.1:.008,t,.18)}}el('effect').addEventListener('change',applyEffect);const arButton=ARButton.createButton(renderer,{optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});el('ar').appendChild(arButton);renderer.xr.addEventListener('sessionstart',()=>{scene.background=null;renderer.setClearAlpha(0);place()});renderer.xr.addEventListener('sessionend',()=>{scene.background=new THREE.Color(0x12253a);anchor=false;inside=false;applyEffect();el('status').textContent='AR ended'});const local=new THREE.Vector3();renderer.setAnimationLoop(()=>{if(renderer.xr.isPresenting){scene.background=null;renderer.setClearAlpha(0);if(anchor){const cam=renderer.xr.getCamera();zone.updateMatrixWorld(true);local.copy(cam.position);zone.worldToLocal(local);const now=Math.abs(local.x)<=.5&&Math.abs(local.y)<=.5&&Math.abs(local.z)<=.5;if(now!==inside){inside=now;applyEffect();el('status').textContent=inside?'INSIDE VIP ZONE · audio effect active':'OUTSIDE VIP ZONE · outside audio effect'}}}renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>

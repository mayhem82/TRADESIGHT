<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT — Experiment 01 Depth Perception</title><style>body{font:18px system-ui;background:#101d2a;color:white;margin:0;padding:18px}button{font:inherit;padding:14px;margin:8px 0;display:block;background:#196c83;color:white;border:1px solid white;border-radius:8px}#status,#log{white-space:pre-wrap;overflow-wrap:anywhere}#log{font-size:16px;max-height:38vh;overflow:auto}a{color:#bde8ff}</style></head><body><a href="./model-library.html">← Model Library</a><h2>Experiment 01 — Depth Perception</h2><p>Native WebXR diagnostic. Start depth AR; acquisition runs automatically and the session exits after the result. No Three.js, models, simulated depth or continuous rendering.</p><button id="start">START BASIC AR — NO DEPTH</button><button id="depth">START DEPTH AR — NO RENDERER</button><button id="read" disabled hidden>READ DEPTH — ONE FRAME</button><button id="end" disabled>END AR</button><p id="measure">Depth measurements: not acquired</p><p id="status">Checking WebXR availability…</p><pre id="log"></pre><script>
const status=document.getElementById('status'),log=document.getElementById('log');let session=null;let depthMode=false;let gl=null,baseLayer=null,referenceSpace=null;let depthRunning=false;const read=document.getElementById('read'),measure=document.getElementById('measure');
function report(s){status.textContent=s;log.textContent=new Date().toLocaleTimeString()+' '+s+'\n'+log.textContent}
window.addEventListener('error',e=>report('Script error: '+e.message));window.addEventListener('unhandledrejection',e=>report('Promise error: '+(e.reason?.message||e.reason)));
(async()=>{if(!navigator.xr){report('WebXR API unavailable');return}try{report((await navigator.xr.isSessionSupported('immersive-ar'))?'Immersive AR supported — ready':'Immersive AR unsupported')}catch(e){report('Support check failed: '+e.message)}})();
async function startSession(depth){try{if(session){report('End current session before starting another');return}depthMode=depth;report('Requesting '+(depth?'depth-enabled':'basic')+' immersive-ar session…');const options=depth?{requiredFeatures:['depth-sensing'],depthSensing:{usagePreference:['cpu-optimized'],dataFormatPreference:['luminance-alpha']}}:{};session=await navigator.xr.requestSession('immersive-ar',options);document.getElementById('end').disabled=false;read.disabled=!depth;report((depth?'Depth-enabled':'Basic')+' AR session started; no render loop or graphics. Depth data not yet read.');session.addEventListener('end',()=>{depthRunning=false;session=null;read.disabled=true;document.getElementById('end').disabled=true;report('AR session ended')},{once:true});if(depth){readDepthOnce();}}catch(e){report('Session request failed: '+(e?.name||'Error')+' — '+e.message)}};document.getElementById('start').onclick=()=>startSession(false);document.getElementById('depth').onclick=()=>startSession(true);
async function readDepthOnce(){if(!session||!depthMode){report('Start depth-enabled session first');return}if(depthRunning)return;depthRunning=true;read.disabled=true;report('Automatically preparing one-frame depth acquisition…');try{if(!gl){const canvas=document.createElement('canvas');report('Creating XR-compatible graphics context');gl=canvas.getContext('webgl2',{xrCompatible:true,alpha:true})||canvas.getContext('webgl',{xrCompatible:true,alpha:true});if(!gl)throw Error('WebGL unavailable');await gl.makeXRCompatible();}baseLayer=new XRWebGLLayer(session,gl);session.updateRenderState({baseLayer});report('XR graphics layer configured');referenceSpace=await session.requestReferenceSpace('local');report('XR graphics layer and local reference space ready; requesting frames');let attempts=0,waiting=false;const onFrame=(time,frame)=>{try{attempts++;const pose=frame.getViewerPose(referenceSpace);const view=pose?.views?.[0];if(!view){if(attempts<30){report('XR frame '+attempts+': waiting for viewer pose');session.requestAnimationFrame(onFrame);return}throw Error('No viewer pose after 30 frames')}if(typeof frame.getDepthInformation!=='function')throw Error('CPU depth API not exposed');const info=frame.getDepthInformation(view);if(!info){if(attempts<30){report('XR frame '+attempts+': waiting for CPU depth');session.requestAnimationFrame(onFrame);return}throw Error('No CPU depth data after 30 frames')}const w=info.width,h=info.height;const raw=new Uint8Array(info.data);if(raw.length<w*h*2)throw Error('Depth buffer smaller than expected');const samples=[];for(const [name,u,v] of [['Centre',.5,.5],['Left',.25,.5],['Right',.75,.5],['Top',.5,.25],['Bottom',.5,.75]]){let ix=Math.min(w-1,Math.floor(u*w)),iy=Math.min(h-1,Math.floor(v*h));const i=2*(iy*w+ix);const meters=(raw[i]+256*raw[i+1])*info.rawValueToMeters;samples.push(name+': '+(Number.isFinite(meters)&&meters>0?meters.toFixed(2)+' m':'invalid'))}measure.textContent=samples.join(' | ');report('DEPTH FRAME RECEIVED: '+w+' × '+h+'; samples are uncalibrated browser depth values');}catch(e){report('Depth frame error: '+(e?.message||e))}finally{depthRunning=false;read.disabled=false;if(session){session.end().catch(e=>report('Automatic exit error: '+e.message))}}};session.requestAnimationFrame(onFrame);setTimeout(()=>{if(depthRunning&&session){report('TIMEOUT: XR frame callback did not complete in 8 seconds');depthRunning=false;session.end().catch(()=>{})}},8000);}catch(e){report('Depth setup error: '+(e?.name||'Error')+' — '+e.message);read.disabled=false;if(session)session.end().catch(()=>{})}};
document.getElementById('end').onclick=async()=>{if(session)await session.end()};
</script></body></html>

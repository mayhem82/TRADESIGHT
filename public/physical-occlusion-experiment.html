<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT — Experiment 01 Depth Perception</title><style>body{font:18px system-ui;background:#101d2a;color:white;margin:0;padding:18px}button{font:inherit;padding:14px;margin:8px 0;display:block;background:#196c83;color:white;border:1px solid white;border-radius:8px}#status,#log{white-space:pre-wrap;overflow-wrap:anywhere}#log{font-size:14px;max-height:38vh;overflow:auto}a{color:#bde8ff}</style></head><body><a href="./model-library.html">← Model Library</a><h2>Experiment 01 — Depth Perception</h2><p>Diagnostic: native WebXR session without Three.js, models, renderer or depth reads.</p><button id="start">START BASIC AR — NO DEPTH</button><button id="depth">START DEPTH AR — NO RENDERER</button><button id="end" disabled>END AR</button><p id="status">Checking WebXR availability…</p><pre id="log"></pre><script>
const status=document.getElementById('status'),log=document.getElementById('log');let session=null;let depthMode=false;
function report(s){status.textContent=s;log.textContent=new Date().toLocaleTimeString()+' '+s+'\n'+log.textContent}
window.addEventListener('error',e=>report('Script error: '+e.message));window.addEventListener('unhandledrejection',e=>report('Promise error: '+(e.reason?.message||e.reason)));
(async()=>{if(!navigator.xr){report('WebXR API unavailable');return}try{report((await navigator.xr.isSessionSupported('immersive-ar'))?'Immersive AR supported — ready':'Immersive AR unsupported')}catch(e){report('Support check failed: '+e.message)}})();
async function startSession(depth){try{if(session){report('End current session before starting another');return}depthMode=depth;report('Requesting '+(depth?'depth-enabled':'basic')+' immersive-ar session…');const options=depth?{requiredFeatures:['depth-sensing'],depthSensing:{usagePreference:['cpu-optimized'],dataFormatPreference:['luminance-alpha']}}:{};session=await navigator.xr.requestSession('immersive-ar',options);document.getElementById('end').disabled=false;report((depth?'Depth-enabled':'Basic')+' AR session started; no render loop or graphics. Depth data not yet read.');session.addEventListener('end',()=>{session=null;document.getElementById('end').disabled=true;report('AR session ended')},{once:true})}catch(e){report('Session request failed: '+(e?.name||'Error')+' — '+e.message)}};document.getElementById('start').onclick=()=>startSession(false);document.getElementById('depth').onclick=()=>startSession(true);
document.getElementById('end').onclick=async()=>{if(session)await session.end()};
</script></body></html>

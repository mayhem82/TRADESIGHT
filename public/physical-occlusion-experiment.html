<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADESIGHT — Experiment 01 Depth</title><style>body{margin:0;padding:20px;background:#101d2a;color:white;font:20px/1.5 system-ui;overflow-wrap:anywhere}main{max-width:760px;margin:auto}a{color:#bde8ff}button{font:inherit;display:block;padding:14px;margin:12px 0;background:#196c83;color:white;border:1px solid #c3e9f5;border-radius:9px}button:disabled{opacity:.5}#status{font-weight:700}#log{white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.5 system-ui;max-height:45vh;overflow:auto}#measure{font-size:22px}</style></head><body><main><a href="./model-library.html">← Model Library</a><h1>Experiment 01 — Depth Perception</h1><p>Real-world depth only. No virtual models or simulated readings. This test automatically acquires one depth frame, then attempts to exit immersive AR.</p><button id="depth">START DEPTH TEST</button><button id="end" disabled>END SESSION</button><p id="status">Checking WebXR…</p><p id="measure">Depth: not measured</p><h2>Diagnostic log</h2><div id="log"></div><p><a href="./documents.html">Continuity snapshots</a></p></main><script>
const $=id=>document.getElementById(id),status=$('status'),log=$('log'),measure=$('measure');let session=null,gl=null,referenceSpace=null,active=false,timeout=null;
function report(msg){status.textContent=msg;const row=document.createElement('div');row.textContent=new Date().toLocaleTimeString()+' — '+msg;log.prepend(row)}
window.addEventListener('error',e=>report('JavaScript error: '+e.message));window.addEventListener('unhandledrejection',e=>report('Promise error: '+(e.reason?.message||e.reason)));
async function closeSession(){if(timeout){clearTimeout(timeout);timeout=null}if(session){const s=session;try{await s.end()}catch(e){report('Session exit error: '+e.message)}}}
async function finish(message){if(!active)return;active=false;report(message);await closeSession()}
async function prepareGraphics(){report('Preparing WebGL BEFORE XR session');const canvas=document.createElement('canvas');gl=canvas.getContext('webgl2',{xrCompatible:true,alpha:true})||canvas.getContext('webgl',{xrCompatible:true,alpha:true});if(!gl)throw Error('WebGL unavailable');if(gl.makeXRCompatible)await gl.makeXRCompatible();report('XR-compatible WebGL ready')}
function sampleDepth(info){const w=info.width,h=info.height,raw=new Uint8Array(info.data);if(raw.byteLength<w*h*2)throw Error('Depth buffer too small');const uv=info.normDepthBufferFromNormView;const samples=[];for(const [name,u,v] of [['Centre',.5,.5],['Left',.25,.5],['Right',.75,.5],['Top',.5,.25],['Bottom',.5,.75]]){let x=u,y=v;if(uv){const p=new DOMPoint(u,v,0,1).matrixTransform(uv);if(p.w){x=p.x/p.w;y=p.y/p.w}}const ix=Math.min(w-1,Math.max(0,Math.floor(x*w))),iy=Math.min(h-1,Math.max(0,Math.floor(y*h))),i=2*(iy*w+ix);const metres=(raw[i]+256*raw[i+1])*info.rawValueToMeters;samples.push(name+': '+(Number.isFinite(metres)&&metres>0?metres.toFixed(2)+' m':'invalid'))}return {w,h,samples}}
async function start(){if(active||session)return;active=true;$('depth').disabled=true;measure.textContent='Depth: awaiting real sensor data';let frames=0;try{if(!navigator.xr)throw Error('WebXR unavailable');await prepareGraphics();report('Requesting depth-enabled immersive AR');const options={requiredFeatures:['depth-sensing'],depthSensing:{usagePreference:['cpu-optimized'],dataFormatPreference:['luminance-alpha']}};session=await navigator.xr.requestSession('immersive-ar',options);$('end').disabled=false;session.addEventListener('end',()=>{session=null;active=false;$('depth').disabled=false;$('end').disabled=true;if(timeout){clearTimeout(timeout);timeout=null}report('AR session ended')},{once:true});report('Depth-enabled session created');session.updateRenderState({baseLayer:new XRWebGLLayer(session,gl)});report('XR graphics layer configured');referenceSpace=await session.requestReferenceSpace('local');report('Local reference space ready');timeout=setTimeout(()=>{if(active)finish('TIMEOUT: no usable depth after 10 seconds')},10000);
const onFrame=(time,frame)=>{if(!active||!session)return;frames++;try{const pose=frame.getViewerPose(referenceSpace);const view=pose?.views?.[0];if(!view){if(frames===1)report('Frames arriving; awaiting pose');if(frames<120){session.requestAnimationFrame(onFrame);return}throw Error('No viewer pose')}if(typeof frame.getDepthInformation!=='function')throw Error('CPU depth API unavailable');const info=frame.getDepthInformation(view);if(!info){if(frames===1)report('Frames arriving; awaiting depth data');if(frames<120){session.requestAnimationFrame(onFrame);return}throw Error('Depth frames unavailable')}const result=sampleDepth(info);measure.textContent=result.samples.join(' | ');finish('REAL DEPTH FRAME RECEIVED: '+result.w+' × '+result.h+' after '+frames+' XR frames');}catch(e){finish('Depth acquisition error: '+e.message)}};session.requestAnimationFrame(onFrame);report('XR frame callback requested');}catch(e){report('Setup failure: '+(e?.name||'Error')+' — '+e.message);await closeSession();active=false;$('depth').disabled=false}}
$('depth').onclick=start;$('end').onclick=()=>finish('Manual session exit requested');(async()=>{try{report(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar')?'Immersive AR supported':'Immersive AR unavailable')}catch(e){report('Support check error: '+e.message)}})();
</script></body></html>

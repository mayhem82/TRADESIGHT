name: Verify independent photo site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:photo
      - run: npm run build
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0
      - run: python -m unittest discover -s photo-site/worker -p "test_*.py" -v

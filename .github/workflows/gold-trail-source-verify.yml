name: Gold Trail original photo verification
on:
  push:
    branches: [gold-trail-image-dna-source]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test photo source and metadata preservation
        run: node --test public/gold-trail/source-integrity.test.mjs public/gold-trail/photo-metadata.test.mjs public/gold-trail/vision-camera-capture.test.mjs

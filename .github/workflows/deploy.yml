name: Deploy TRADESIGHT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Verify built app output
        run: |
          test -f dist/index.html
          find dist -type f -maxdepth 3 -print
          test -d dist/assets
          find dist/assets -type f -name "*.js" | grep .
      - name: Verify standalone AR pages included in published artifact
        run: |
          test -s dist/lighthouse-ar.html
          test -s dist/exploded-car-ar.html
          grep -q 'TRADESIGHT' dist/lighthouse-ar.html
          grep -q 'TRADESIGHT' dist/exploded-car-ar.html
          test -s dist/model-library.html
          test -s dist/model-library.json
          grep -q 'Model Library' dist/model-library.html
      - name: Verify Stone Room contracts
        run: |
          node --test tests/stone-room/core.test.mjs tests/stone-room/xr.test.mjs tests/stone-room/graphics.test.mjs
          python tests/stone-room/assets.py
          test -s dist/stone-room/index.html
          test -s dist/stone-room/assets/stone-room.glb
          test -s dist/stone-room/assets/photo-guided-npc.glb
          test -s dist/stone-room/vendor/three.module.js
      - name: Verify isolated camera experiment assets and lifecycle
        run: node dist/ar-experiments/mayhem-ar/experiments/verify.cjs
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify camera-free experiments in desktop and phone viewports
        run: python tests/camera-experiments/browser.py
      - name: Retain camera experiment verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-experiments-verification
          path: |
            tests/camera-experiments/*report.json
            tests/camera-experiments/*.png
      - name: Verify Stone Room in desktop and Android viewports
        run: STONE_ROOM_ROOT=dist python tests/stone-room/browser.py
      - name: Retain Stone Room test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stone-room-verification
          path: |
            tests/stone-room/*report.json
            tests/stone-room/*.png
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify gallery is in deployment
        run: |
          test -s dist/gallery.html
          grep -q 'Independent Model Gallery' dist/gallery.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout production source for live verification
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Stone Room byte identity
        run: python tests/stone-room/live.py
      - name: Retain published verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stone-room-live-verification
          path: tests/stone-room/live-report.json
